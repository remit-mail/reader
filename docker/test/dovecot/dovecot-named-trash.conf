# A second Dovecot for the black-box e2e stack, identical to dovecot.conf but
# for one thing: no folder on it advertises \Trash, and the folder reader files
# deletes into is `Deleted Messages`, which matches only by name.
#
# That tier had no server to run against. Every mailbox the default lane hands
# out carries the flag, so a Trash resolved from a name guess — the one evidence
# an expunge is not allowed to act on (#876) — was unreachable from outside the
# process. Only an account a spec deliberately points here goes to this server;
# the lane above is what every other account uses, and the flags it advertises
# are unaffected by this one existing.
#
# Reachable only from the compose network and the loopback port the e2e overlay
# publishes. Do not reuse this configuration for anything holding real mail.

protocols = imap
log_path = /dev/stderr
auth_verbose = yes
ssl = no
listen = *
first_valid_uid = 1000

mail_home = /srv/mail/%u
mail_location = maildir:~/Maildir

!include /etc/dovecot/e2e-passdb.conf

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

auth_mechanisms = plain login
disable_plaintext_auth = no

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }

  # The whole point of this lane. `deleted messages` is a conventional Trash
  # name reader matches on, and nothing here flags it — so the role resolves
  # from the name and from nothing else. No `mailbox Trash` block, because
  # `auto = subscribe` makes a mailbox permanent: it is listed with its
  # special-use whether or not it exists, and an IMAP DELETE does not remove it.
  mailbox "Deleted Messages" {
    auto = subscribe
  }
}
