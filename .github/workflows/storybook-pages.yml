name: Storybook Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Codegen (generated @remit/* packages)
        run: make
      - name: Build Storybook
        run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-main
          path: packages/workbench/storybook-static
          retention-days: 1

  # Its own job so this is the only place that pushes to gh-pages carry the
  # shared cross-workflow concurrency group below -- the build above stays
  # cheap to re-run and never blocks on another push in flight.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # An optimization, not the correctness guarantee: shared with
    # storybook-preview.yml and storybook-preview-cleanup.yml so the three
    # producers usually serialize instead of piling up. It cannot be relied on
    # for correctness by itself -- GitHub holds at most one running and one
    # pending job per group, so a third simultaneous producer can still bump a
    # pending one. gh-pages-publish.mjs is what actually protects the branch,
    # via a leased push that is rejected rather than silently overwritten if
    # it loses a race, and retried against the branch's new tip. All three
    # files must spell this group the same way; a test asserts they do.
    concurrency:
      group: gh-pages-branch-push
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: storybook-main
          path: storybook-main-download
      - name: Publish to the gh-pages branch root
        run: >-
          node npm-scripts/gh-pages-publish.mjs publish
          --source storybook-main-download
          --dest .
          --preserve pr
          --message "Publish Storybook from ${{ github.sha }}"
