name: Docs Site

on:
  push:
    branches: [main]
    paths:
      - "doc/remit.email/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The site is a workspace of the root manifest, so it installs and builds
      # from there -- that is also what puts it in `npm run typecheck`.
      - name: Install
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Build
        run: npm run build -w @remit/docs-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc/remit.email/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
