name: Docs Site

on:
  push:
    branches: [main]
    paths:
      - "doc/remit.email/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The site is a workspace of the root manifest, so it installs and builds
      # from there -- that is also what puts it in `npm run typecheck`.
      - name: Install
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Build
        run: npm run build -w @remit/docs-site
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: doc/remit.email/output
          retention-days: 1

  # Its own job so this is the only place that pushes to gh-pages carry the
  # shared cross-workflow concurrency group below -- the build above stays
  # cheap to re-run and never blocks on another push in flight.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Two pushes from main queue behind each other instead of one cancelling
    # the other. gh-pages-publish.mjs is what actually protects the branch, via
    # a leased push that is rejected rather than silently overwritten if it
    # loses a race, and retried against the branch's new tip.
    concurrency:
      group: gh-pages-branch-push
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: docs-site-download

      # The docs site owns the whole branch.
      - name: Publish the site to the gh-pages branch root
        run: >-
          node npm-scripts/gh-pages-publish.mjs publish
          --source docs-site-download
          --dest .
          --message "Publish the docs site from ${{ github.sha }}"
