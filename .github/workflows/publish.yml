# Publish pipeline: semantic-release publishes every open-core `@remit/*`
# package — the workspace services under packages/ and the TypeSpec-generated
# packages under build/ — on every push to main. Each package's
# `<name>@<version>` git tag is its version, and the conventional commits that
# touched it since that tag pick the next one. Versions never land in git; the
# job pushes the new tags. It is gated behind the `NPM_PUBLISH_ENABLED`
# repository variable so publishing is armed deliberately.
#
# `v*` tags release the app and are handled by release.yml.
#
# The pull request half — the dry run that prints each package's next version
# and packs it without tagging or publishing — lives in ci.yml as
# `publish-dry-run`, because only a job in that workflow can be a dependency of
# the `gate` job branch protection requires.
#
# Auth is the NPM_TOKEN secret, a stopgap until npm accepts GitHub's immutable OIDC
# subjects (https://github.com/npm/cli/issues/9969) and the trusted publishers
# already configured take over. Provenance still uses the OIDC token.
name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: make
      # @remit/spellcheck-engine is published from build/hunspell.
      - uses: ./.github/actions/hunspell
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
