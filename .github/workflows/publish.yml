# The pull request dry run lives in ci.yml as `publish-dry-run`, because only a
# job in that workflow can be a dependency of the required `gate` job.
#
# Auth is the NPM_TOKEN secret, a stopgap until npm accepts GitHub's immutable
# OIDC subjects (https://github.com/npm/cli/issues/9969).
name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: make
      # @remit/spellcheck-engine is published from build/hunspell.
      - uses: ./.github/actions/hunspell
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
