# Cuts an immutable release: publishes the image roster at a vX.Y.Z tag and
# creates the matching GitHub release. Triggered by pushing the tag (see
# npm-scripts/release-tag.sh / `npm run release:tag`), never by a branch push.
#
# The trigger is a bare tag pattern, so any pushed vX.Y.Z tag reaches this
# workflow — including a hand-pushed lightweight tag that never ran
# release:tag. The first step re-checks the tag here rather than trusting the
# script: it must be an annotated tag whose message is a valid summary (the
# string rendered verbatim on the update consent screen, RFC 037 / the
# manifest schema's `summary`), or the release is refused before anything is
# built or published.
#
# A release tag is never re-pushed. The preflight queries the registry for
# every image in the roster and fails before anything builds if the tag
# already resolves — a botched release is fixed by cutting the next one.
#
# The trigger accepts any pushed v*.*.* tag, including one pushed by hand, so
# the annotation gate is a step in this workflow rather than a check inside
# npm-scripts/release-tag.sh. The tag's annotation is the summary shown
# verbatim on the self-update consent screen; a lightweight tag has none, and
# that surface has nothing legitimate to show.
#
# `:latest` belongs to main (see images.yml) and this workflow must not move
# it, so images:publish runs here with PUSH_LATEST=0.
#
# The GitHub release object is the definition of a published version (RFC 037
# D2, R1a) — never the presence of an image tag. Pushing eight images is not
# atomic, so the release is cut as a draft first; the images are pushed; the
# update manifest is uploaded as the release's `stable.json` asset; and only
# then is the draft flipped to published. This runs on the default
# all-steps-must-succeed behaviour: no `if: always()`, no continue-on-error. A
# run that fails partway leaves a draft release and whatever tags it managed to
# push. A draft is invisible to `releases/latest/download`, so a partial
# release is never discoverable and never offered as an update; the fix is
# cutting the next version, never resuming this one.
#
# The manifest ships as that release asset rather than a commit to `main`: `main`
# requires a pull request and a passing `gate` check with no bypass, so a
# workflow cannot push to it, and a PR opened with GITHUB_TOKEN never triggers
# the checks that would let it merge. The release asset is atomic with the
# release object and needs no write to a protected branch. Its published URL,
# `releases/latest/download/stable.json`, resolves only the latest published,
# non-prerelease release — exactly the discovery contract.
name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # First, before any registry work: a tag with no authored annotation is
      # not a release, and nothing should be built for one.
      - name: Refuse a tag with no authored summary
        run: npm run release:check-annotation
        env:
          TAG: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Log in to GHCR
        run: docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"

      - name: Refuse an already-published tag
        run: npm run release:check-tag
        env:
          REGISTRY: ghcr.io/remit-mail/reader
          TAG: ${{ github.ref_name }}

      # Installed before any release side effect so a bad lockfile fails here,
      # not after a draft and eight images already exist. The manifest writer
      # imports @remit/data-ports for the shared schema, so the workspace has to
      # be present.
      - name: Install the workspace for the manifest writer
        run: npm ci --no-audit --no-fund --loglevel=error

      # A draft up front is invisible to `releases/latest/download`, so nothing
      # is discoverable until the images and the manifest asset are in place and
      # the final step flips it published.
      - name: Create the GitHub release as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --draft --generate-notes

      - name: Build and push the roster
        run: npm run images:publish
        env:
          REGISTRY: ghcr.io/remit-mail/reader
          TAG: ${{ github.ref_name }}
          PUSH: "1"
          PUSH_LATEST: "0"

      # RFC 037 D3 / #131. The manifest is published as the release's own
      # `stable.json` asset — atomic with the release, needing no write to the
      # protected main branch. write-update-manifest.mjs runs against this tag's
      # checkout so deriveSchemaVersion reads the released ref's migration
      # journals; --allow-draft lets it write for the draft it is about to
      # publish while still refusing any other draft. The asset is uploaded
      # before the release is published, so the published
      # `releases/latest/download/stable.json` never 404s.
      - name: Publish the update manifest as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run manifest:write -- "${{ github.ref_name }}" --allow-draft
          gh release upload "${{ github.ref_name }}" deploy/updates/stable.json --clobber

      # Last, and only if every step above succeeded: flipping the draft
      # published is what makes the version — and its manifest asset — the one
      # `releases/latest/download` resolves.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
