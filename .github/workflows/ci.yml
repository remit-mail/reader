name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded pull request pushes are cancelled; runs on main are not, so every
# commit that lands keeps a completed result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this pull request changed, reduced to one answer: prose, or not. The
  # jobs that need a workspace install stand down when it is prose, because a
  # change that adds no source file cannot break a typecheck, a suite, or the
  # publish closure.
  #
  # A job rather than a `paths` filter on the trigger. A filter stops the whole
  # workflow from reporting, `gate` included, and a required check that never
  # reports leaves the pull request blocked forever or merges it with nothing
  # having run.
  #
  # The answer comes from the diff and only the diff. A title, a label or a
  # branch name is a claim about the change rather than the change itself, and
  # the one thing that must not be forgeable here is what gets skipped.
  docs-only:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.decide.outputs.result }}
    steps:
      # Full history: the answer is the diff against the merge base, and a
      # shallow clone has no merge base to find.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # No pull request payload is a push to main, where everything runs.
        run: |
          if [ -z "$BASE" ]; then
            echo "result=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          answer=$(bash npm-scripts/lib/docs-only.sh "$BASE" "$HEAD")
          echo "result=$answer" >>"$GITHUB_OUTPUT"

  # Static validation that needs no workspace install: the installer script, the
  # deploy compose stacks, and the manifest syntax.
  #
  # Runs on every pull request, prose included. It carries the suite that proves
  # the docs-only decision above and the guard that proves every check is still
  # wired, so the two things the skipping rests on are checked on the runs that
  # skip.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The coverage guard is plain stdlib Node and needs no workspace install,
      # only a pinned interpreter.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer — shell syntax
        run: bash -n install.sh

      - name: Installer — shellcheck
        run: shellcheck install.sh

      # The wrapper is the self-update sequence (RFC 037), running as root with
      # the container socket, so POSIX sh is a hard constraint rather than a
      # style rule.
      - name: remit wrapper — shellcheck
        run: shellcheck -s sh deploy/vps/remit deploy/vps/backup/snapshot-db.sh

      - name: Release scripts — shellcheck
        run: |
          shellcheck -x npm-scripts/release-tag.sh npm-scripts/release-check-tag.sh \
            npm-scripts/release-check-annotation.sh \
            npm-scripts/lib/image-roster.sh npm-scripts/lib/manifest-check.sh \
            npm-scripts/lib/summary-check.sh npm-scripts/lib/tag-object-check.sh

      - name: Change classifier — shellcheck
        run: shellcheck npm-scripts/lib/docs-only.sh

      # Every npm-scripts/**/*.test.mjs suite, discovered rather than listed, so
      # adding one runs it on the commit that adds it. No workspace install
      # needed: these test only the pure decision functions in npm-scripts/lib
      # (node:child_process, node:fs, node:test — no @remit/* or third-party
      # imports), which is why they run here instead of with the unit tests.
      - name: Script suites — unit tests
        run: npm run test:scripts

      # Reads the manifest, the workflow files and the scripts they invoke, so
      # it belongs with the other install-free static checks and reports before
      # any job installs.
      - name: CI coverage — every test and check is reachable
        run: npm run check:ci-coverage

      - name: Manifests — JSON syntax
        run: |
          python3 -c 'import json,sys; [json.load(open(f)) for f in sys.argv[1:]]' \
            package.json biome.json tsconfig.json

      - name: Manifests — YAML syntax
        run: |
          python3 -c 'import yaml,sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' \
            .github/workflows/ci.yml .github/workflows/storybook-pages.yml \
            .github/workflows/storybook-preview.yml \
            .github/workflows/storybook-preview-cleanup.yml \
            .github/workflows/images.yml .github/workflows/publish.yml \
            .github/workflows/release.yml .github/actions/setup/action.yml

      # --profile '*' because an unscoped `config` walks past every service
      # behind a profile: without it `backup` and the observability containers
      # are the only part of this file nothing validates, and a malformed one
      # reaches main and fails on the operator's box instead.
      - name: Deploy stack — SQLite compose validates, profiles included
        run: |
          printf 'PUBLIC_ORIGIN=https://ci.invalid\nTLS_MODE=off\nREMIT_DEPLOY_DIR=%s/deploy/vps\n' "$PWD" > deploy/vps/.env
          docker compose -f deploy/vps/docker-compose.sqlite.yml \
            --env-file deploy/vps/.env --profile '*' config -q
          rm -f deploy/vps/.env

      - name: Dev stack — SQLite compose validates
        run: |
          docker compose -f docker-compose.localhost-dev-sqlite.yml \
            --env-file localhost-dev-sqlite.env config -q

  # Biome reads the source tree and never the generated output, so this job
  # skips the codegen restore and reports within a minute of the push. Its file
  # set is TypeScript and JavaScript alone, which is why prose stands it down
  # with the rest: there is no markdown for it to have an opinion about.
  lint:
    runs-on: ubuntu-latest
    needs: [docs-only]
    if: needs['docs-only'].outputs.result != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          codegen: "false"
      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: [docs-only]
    if: needs['docs-only'].outputs.result != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: npm run typecheck

      # What the step above is worth depends on what it reaches, and it reaches
      # only the workspaces. This proves that is every TypeScript file in the
      # tree (#440). It belongs to this job because it expands the tsconfigs
      # with the compiler's own resolver, so it needs the install — the
      # install-free `validate` job carries only the pure decisions it rests on.
      - name: Typecheck reaches every TypeScript file
        run: npm run check:typecheck-coverage

  # Every workspace suite except web-client. web-client dominated the single
  # `test` job — its single-process coverage run was the whole critical path — so
  # it fans out
  # across the shard matrix below and is excluded here to keep it from running
  # twice. Every other package keeps its own native coverage floor untouched;
  # test-parallel runs them three-wide.
  test-rest:
    runs-on: ubuntu-latest
    needs: [docs-only]
    if: needs['docs-only'].outputs.result != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Unit tests
        env:
          TEST_EXCLUDE: web-client
        run: npm run test:ci

      # The e2e suite's own unit checks. They stub `fetch`, so they need neither
      # a deployment nor a browser and belong with the unit tests rather than in
      # either e2e lane — but the suite is a separate npm project from the
      # workspace root, which is why it is a step of its own and not something
      # test-parallel collects.
      - name: e2e suite — unit checks
        run: npm run test:e2e-unit

      # sqlite-vec is the vector backend the self-host default ships
      # (docker-compose.sqlite.yml), and this suite is its only coverage against
      # a real vec0 table. It sits behind RUN_INTEG_TESTS with the suites that
      # need a Postgres or a model download, so it needs naming here — the
      # binaries it loads come from `npm ci` and nothing else.
      - name: search-service — sqlite-vec backend
        run: npm run test:integ:local -w packages/search-service

  # web-client's suite, split into four deterministic shards by test-file size so
  # each runner carries a quarter of the wall time. A shard runs only its slice
  # and emits node's own LCOV coverage with no floor: a shard sees only the files
  # its tests load, so the 86% line floor cannot be enforced until the slices are
  # merged. coverage-web-client does that merge and enforces the floor once.
  #
  # SHARD_TOTAL must equal the matrix length; a mismatch would drop or duplicate
  # files. The two are kept in step here by hand.
  test-web-client:
    runs-on: ubuntu-latest
    needs: [docs-only]
    if: needs['docs-only'].outputs.result != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Unit tests — shard ${{ matrix.shard }}/4
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
        run: node packages/web-client/scripts/test-shard.mjs
      - name: Upload shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-client-lcov-${{ matrix.shard }}
          path: packages/web-client/coverage/shard-${{ matrix.shard }}.lcov
          if-no-files-found: error
          retention-days: 7

  # The floor gate for web-client. It ingests every shard's LCOV and enforces the
  # 86% line floor on the union — the same files the native single-process runner
  # measured before the suite was sharded, so the floor gates every pull request
  # exactly as it did. The merge is pure stdlib, so this job skips the workspace
  # install and reports within seconds of the shards finishing. There is nothing
  # to merge when the shards stand down for a prose change, and a job whose
  # dependency skipped skips too, so this one needs no condition of its own.
  coverage-web-client:
    runs-on: ubuntu-latest
    needs: [test-web-client]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: web-client-lcov-*
          path: web-client-lcov
          merge-multiple: true
      - name: Merge coverage and enforce the line floor
        run: node packages/web-client/scripts/coverage-merge.mjs web-client-lcov/*.lcov

  # Every story in the workbench index, rendered in a real Chromium and — where
  # it has one — its play function executed. Until this job existed a play
  # function ran only when somebody opened Storybook and clicked the story, so
  # the interaction assertions were documentation rather than checks.
  #
  # The runner is Storybook's Vitest addon rather than @storybook/test-runner.
  # Storybook has superseded the test-runner, and its last release that accepts
  # Storybook 9 is 0.23.0; the addon tracks the installed Storybook version
  # exactly. It also needs no served Storybook — it compiles the stories as
  # portable stories through the Storybook Vite config, so the build-and-serve
  # step the test-runner requires is not on the critical path here.
  #
  # Needs the codegen restore: the web-client stories in the index reach
  # components that import the generated @remit/* packages.
  test-stories:
    runs-on: ubuntu-latest
    needs: [docs-only]
    if: needs['docs-only'].outputs.result != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Keyed on the lockfile because the pinned Playwright version lives there,
      # and a browser build belongs to the version that downloaded it.
      - name: Restore the Chromium build
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Story suite
        run: npm run test:stories

  # The pull request half of the two-lane e2e split. This one assembles the stack
  # from the branch under review — queue sidecar, migrator, backend dev-server,
  # imap-worker, vite, SQLite, and the Dovecot container — and runs the black-box
  # suite against it. It is the regression gate: a spec that breaks does so on the
  # commit that broke it.
  #
  # The other lane is the `e2e` job in images.yml. That one runs on main against
  # the published roster and is the deploy gate. Neither replaces the other: this
  # lane has no packaged edge, so the Caddy and APISIX assertions are skipped by
  # name here (packages/e2e/src/stack.ts) and only the image lane covers them.
  #
  # Pull requests only. On main this would re-test from source what images.yml is
  # already testing as shipped. The gate below knows this skip is legitimate and
  # accepts it on push events alone.
  e2e-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [docs-only]
    if: github.event_name == 'pull_request' && needs['docs-only'].outputs.result != 'true'
    steps:
      # Every host-wide name the stack claims — the compose project and its port
      # block — is derived from this. A runner runs one job at a time and reuses
      # its name, so concurrent runs get disjoint slots and an interrupted run's
      # containers are recreated by the next run rather than left behind.
      #
      # Written to the job environment rather than declared in `env:` because the
      # `runner` context does not exist at job level.
      - name: Claim a stack slot
        run: echo "E2E_DEV_SLOT=${{ runner.name }}" >>"$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Start the source-built stack
        run: npm run e2e:dev:up

      - name: Black-box suite
        run: npm run e2e:test

      - name: Collect stack logs
        if: failure()
        env:
          E2E_LOGS_TAIL: "400"
        run: npm run e2e:dev:logs >e2e-dev-stack.log 2>&1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dev-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-dev-stack.log
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 14
          if-no-files-found: warn

      # `always()` rather than `failure()`: a cancelled run leaves host processes
      # and a Dovecot container holding this slot's ports, which the next run on
      # the same runner would then collide with.
      - name: Tear down
        if: always()
        run: npm run e2e:dev:down

  # The pre-publish gate: pack every open-core package, check the publish
  # closure, and install the result from the public registry into a clean
  # directory. It lives here rather than beside the real publish job in
  # publish.yml because only a job in this workflow can be a dependency of the
  # gate below, and an advisory publish check is one a broken publish surface
  # merges straight past.
  #
  # Pull requests only. On main the same content is published for real by
  # publish.yml, and a dry run of a publish that is about to happen gates
  # nothing. The gate below accepts this skip on push events alone.
  #
  # Installs directly rather than through .github/actions/setup: this job must
  # resolve the published closure against a tree built the way a consumer's
  # would be, not one restored from a workspace cache.
  publish-dry-run:
    needs: [docs-only]
    if: github.event_name == 'pull_request' && needs['docs-only'].outputs.result != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: make
      # @remit/web-client-dist is the built web client, so packing it runs the
      # vite build, so it needs the spellchecker's engine. This job deliberately
      # skips the setup action (it builds the tree a consumer would), so it
      # reaches for the engine's cache directly.
      - uses: ./.github/actions/hunspell
      - run: npm run release:dry-run
      # Guards install-ability of the published set: a clean directory, outside
      # the repo, installing @remit/backend alone must pull and resolve its full
      # transitive @remit closure off the public registry — the failure mode this
      # pipeline exists to prevent. Each manifest declares its @remit imports, so
      # one package drags in the rest.
      - name: Clean-install acceptance
        run: |
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null
          npm install @remit/backend --loglevel=error
          node -e "for (const p of ['@remit/backend','@remit/data-ports','@remit/drizzle-service','@remit/domain-enums','@remit/api-openapi-types','@remit/mailbox-service','@remit/search-service','@remit/storage-service','@remit/auth-service','@remit/secrets-service','@remit/sqs-client','@remit/mail-oauth-service','@remit/logger-lambda','@remit/api-zod-schemas','@remit/drizzle-sqlite-schema']) require.resolve(p)"

      # Consumer-side acceptance for the web client's published build surface:
      # off the packed tarball, assert the harness toolchain is declared (not
      # devDependencies-only) and that `./vite-preset` plus its toolchain imports
      # resolve in a clean dir with only the declared peers installed.
      - name: Web client consumer acceptance
        run: npm run check:web-client-consumer

  # The one status check branch protection requires. Every other job in this
  # workflow is a dependency, so jobs can be added, renamed, or split here
  # without ever touching the protection settings — add the job to `needs` and
  # to the assertions below and it is enforced.
  #
  # A `needs:` job is skipped, not failed, when a dependency fails, and a skipped
  # required check reads as passing to branch protection. Hence `always()` plus
  # an assertion per dependency: `failure`, `cancelled`, and any unaccounted-for
  # `skipped` all fail here. A skip is legitimate in exactly two situations: the
  # two pull-request-only jobs, e2e-dev and publish-dry-run, on main; and the
  # jobs that need a workspace install, on a pull request the classifier read as
  # prose.
  #
  # That second permission is granted by the classifier's own result and nothing
  # else. If docs-only failed, was cancelled, or returned any other answer, no
  # skip is authorised and every job that stood down fails the gate — a broken
  # classifier cannot spend the suite it was meant to protect.
  #
  # The count guard is the backstop for the two-places problem: a job wired into
  # `needs` but not asserted below fails the gate rather than riding along
  # unchecked.
  gate:
    runs-on: ubuntu-latest
    needs:
      [
        docs-only,
        validate,
        lint,
        typecheck,
        test-rest,
        test-web-client,
        coverage-web-client,
        test-stories,
        e2e-dev,
        publish-dry-run,
      ]
    if: always()
    steps:
      - name: Require every job to have succeeded
        env:
          DOCS_ONLY: ${{ needs['docs-only'].result }}
          DOCS_ONLY_ANSWER: ${{ needs['docs-only'].outputs.result }}
          DOCS_MAY_SKIP: ${{ needs['docs-only'].result == 'success' && needs['docs-only'].outputs.result == 'true' }}
          VALIDATE: ${{ needs.validate.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST_REST: ${{ needs['test-rest'].result }}
          # A matrix job is one entry in the needs context: this result is success
          # only when every shard succeeded.
          TEST_WEB_CLIENT: ${{ needs['test-web-client'].result }}
          COVERAGE_WEB_CLIENT: ${{ needs['coverage-web-client'].result }}
          TEST_STORIES: ${{ needs['test-stories'].result }}
          E2E_DEV: ${{ needs['e2e-dev'].result }}
          PUBLISH_DRY_RUN: ${{ needs['publish-dry-run'].result }}
          PR_ONLY_MAY_SKIP: ${{ github.event_name != 'pull_request' }}
          ALL_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -u
          failed=0
          asserted=0

          # A job may carry more than one reason it is allowed to have skipped:
          # e2e-dev stands down both on main and on a prose pull request.
          authorised() {
            for reason in "$@"; do
              if [ "$reason" = "true" ]; then
                return 0
              fi
            done
            return 1
          }

          require() {
            name=$1
            result=$2
            shift 2
            asserted=$((asserted + 1))
            if [ "$result" = "success" ]; then
              echo "$name: success"
              return
            fi
            if [ "$result" = "skipped" ] && authorised "$@"; then
              echo "$name: skipped (event=${GITHUB_EVENT_NAME}, docs-only=${DOCS_ONLY_ANSWER:-unset})"
              return
            fi
            echo "::error::$name: $result"
            failed=1
          }

          require docs-only "$DOCS_ONLY"
          require validate "$VALIDATE"
          require lint "$LINT" "$DOCS_MAY_SKIP"
          require typecheck "$TYPECHECK" "$DOCS_MAY_SKIP"
          require test-rest "$TEST_REST" "$DOCS_MAY_SKIP"
          require test-web-client "$TEST_WEB_CLIENT" "$DOCS_MAY_SKIP"
          require coverage-web-client "$COVERAGE_WEB_CLIENT" "$DOCS_MAY_SKIP"
          require test-stories "$TEST_STORIES" "$DOCS_MAY_SKIP"
          require e2e-dev "$E2E_DEV" "$PR_ONLY_MAY_SKIP" "$DOCS_MAY_SKIP"
          require publish-dry-run "$PUBLISH_DRY_RUN" "$PR_ONLY_MAY_SKIP" "$DOCS_MAY_SKIP"

          wired=0
          for _ in $ALL_RESULTS; do wired=$((wired + 1)); done
          if [ "$asserted" -ne "$wired" ]; then
            echo "::error::$wired jobs are wired into needs but $asserted are asserted"
            failed=1
          fi

          [ "$failed" -eq 0 ] || exit 1
          echo "every required job succeeded"
