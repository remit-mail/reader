# The two mail servers the black-box e2e suite needs, on their own so both lanes
# can use them: the image lane composes this file with docker-compose.sqlite.yml
# + docker-compose.e2e.yml, and the source-built dev lane (`npm run e2e:dev`)
# brings it up alone and runs the app from the worktree.
#
# Dovecot is where mail arrives. Every username authenticates with one shared
# password and gets its own empty maildir, so each run can claim a mailbox
# nobody has written to. The suite APPENDs the messages each spec needs.
#
# Mailpit is where mail goes. Nothing in the stack accepted a submission before
# it, so `smtpEnabled` was false on every account and the send path resolved
# every outbox row to `blocked` — the composed MIME never left the process.
#
# A second Dovecot flags no folder \Trash. Every mailbox the lane above hands
# out carries the flag, so a Trash that resolves from a folder's name and from
# nothing else — the evidence an expunge may not act on — had no server to run
# against. Only an account a spec deliberately points at it goes there.
#
# A second Mailpit refuses instead of accepting. Every send spec worked from a
# server that took whatever it was handed, so the whole refusal half of the send
# path — the row that settles `failed`, the reason it carries, the retry that
# gets it out — had nothing to run against. Only an account a spec deliberately
# points at it goes there; the lane above is what every other account uses.
#
# The bind mounts are relative to this directory, so compose must be invoked
# with `--project-directory deploy/vps` (see npm-scripts/e2e-compose.sh).

services:
  dovecot:
    image: dovecot/dovecot:2.3.21
    entrypoint: ["/bin/sh", "/etc/dovecot/e2e-entrypoint.sh"]
    environment:
      E2E_IMAP_PASSWORD: ${E2E_IMAP_PASSWORD:?set E2E_IMAP_PASSWORD}
    volumes:
      - ../../docker/test/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ../../docker/test/dovecot/entrypoint.sh:/etc/dovecot/e2e-entrypoint.sh:ro
    ports:
      # Published so the suite can APPEND from the host. On the image lane the
      # app reaches it as `dovecot:143` on the compose network instead; on the
      # dev lane the app is a host process and uses this port too.
      - "127.0.0.1:${E2E_IMAP_PORT:-11143}:143"
    healthcheck:
      test: ["CMD", "doveadm", "service", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  dovecot-named-trash:
    image: dovecot/dovecot:2.3.21
    entrypoint: ["/bin/sh", "/etc/dovecot/e2e-entrypoint.sh"]
    environment:
      E2E_IMAP_PASSWORD: ${E2E_IMAP_PASSWORD:?set E2E_IMAP_PASSWORD}
    volumes:
      - ../../docker/test/dovecot/dovecot-named-trash.conf:/etc/dovecot/dovecot.conf:ro
      - ../../docker/test/dovecot/entrypoint.sh:/etc/dovecot/e2e-entrypoint.sh:ro
    ports:
      # Same split as the lane above: the app reaches it as
      # `dovecot-named-trash:143` on the compose network, the suite APPENDs
      # through this published loopback port.
      - "127.0.0.1:${E2E_IMAP_NAMED_TRASH_PORT:-11145}:143"
    healthcheck:
      test: ["CMD", "doveadm", "service", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.30.6
    environment:
      # Any credential authenticates, which is what makes the sink usable with
      # the account's own IMAP password: the send path reuses it for SMTP unless
      # the account carries a separate one. The insecure flag is what allows
      # AUTH over a plaintext connection at all — there is no TLS here, the
      # listener is on the compose network and a loopback port.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Never evict. The default ring buffer drops the oldest message once it
      # fills, and a spec asserting on a message the sink silently discarded
      # fails as if the send never happened.
      MP_MAX_MESSAGES: "0"
    ports:
      # Submission, then the HTTP API the suite reads the accepted bytes back
      # from. On the image lane the app reaches submission as `mailpit:1025` on
      # the compose network; on the dev lane the app is a host process and uses
      # the published port. The API is only ever read from the host.
      - "127.0.0.1:${E2E_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${E2E_SMTP_HTTP_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit-rejecting:
    image: axllent/mailpit:v1.30.6
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "0"
      # The refusal, and the whole difference between this lane and the one
      # above. Mailpit's recipient allowlist is a regular expression matched at
      # RCPT TO: every address outside it is answered `550 5.1.0 Requested
      # action not taken: mailbox unavailable` and the submission ends with
      # nothing accepted. It names exactly one address a spec sends to, so the
      # lane refuses a first send and accepts the same message once its
      # recipient has been corrected — which is what makes a refused message's
      # recovery testable without also changing the account (#933).
      MP_SMTP_ALLOWED_RECIPIENTS: ${E2E_SMTP_REJECT_ALLOWED_RECIPIENTS:?set E2E_SMTP_REJECT_ALLOWED_RECIPIENTS}
    ports:
      # Same split as the lane above: submission, then the HTTP API. The API is
      # read to prove the refused message reached nobody, so this lane needs one
      # of its own — the other lane's totals say nothing about this one's.
      - "127.0.0.1:${E2E_SMTP_REJECT_PORT:-11027}:1025"
      - "127.0.0.1:${E2E_SMTP_REJECT_HTTP_PORT:-18027}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
