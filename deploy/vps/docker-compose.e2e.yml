# Overlay that turns the reference SQLite self-host stack into the target of the
# black-box e2e suite (`npm run e2e`). Two changes and nothing else — the point
# is that the suite tests the published images as an operator gets them:
#
#   1. a Dovecot IMAP server and a Mailpit SMTP sink on the compose network, so
#      a real mailbox exists to sync from and a real submission has somewhere to
#      land (docker-compose.dovecot.yml, shared with the source-built dev lane);
#   2. the edge moved off :80/:443 onto a loopback port, so the suite can run
#      next to anything else on the box;
#   3. the queue sidecar's port published on loopback, so a spec can put an
#      event on the queue the workers read.
#
# Always used together with the files it overlays:
#   docker compose -f docker-compose.sqlite.yml \
#                  -f docker-compose.dovecot.yml \
#                  -f docker-compose.e2e.yml up -d
#
# The project name differs from the base file's, so an e2e run and a real
# deployment never share containers or volumes.
name: remit-e2e

services:
  # `!override` replaces the base list instead of appending to it — compose
  # merges sequences, and inheriting 80/443 would collide with anything already
  # holding those ports.
  caddy:
    ports: !override
      - "127.0.0.1:${E2E_HTTP_PORT:-18080}:80"

  # At-least-once delivery is a property of the queue, not of the app, so the
  # only way to drive a redelivery from outside is to put the event back on the
  # queue (#925 spec 6, #858). Loopback, exactly like the mail-server ports:
  # the sidecar authenticates nobody and speaks for every account on the
  # deployment, so this is reachable from the host running the suite and from
  # nowhere else. Nothing in a real deployment publishes it —
  # docker-compose.sqlite.yml keeps it on the compose network.
  queue:
    ports:
      - "127.0.0.1:${E2E_QUEUE_PORT:-19324}:9324"

  backend:
    depends_on:
      dovecot:
        condition: service_healthy
      dovecot-named-trash:
        condition: service_healthy

  imap-worker:
    depends_on:
      dovecot:
        condition: service_healthy
      dovecot-named-trash:
        condition: service_healthy

  smtp-worker:
    depends_on:
      mailpit:
        condition: service_healthy
